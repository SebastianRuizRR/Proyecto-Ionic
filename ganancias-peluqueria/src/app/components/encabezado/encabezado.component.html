<div class="encabezado">
  <div class="encabezado__textos">
    <span class="encabezado__antetitulo">{{ antetitulo() }}</span>
    <h1 class="encabezado__titulo">{{ titulo() }}</h1>
  </div>

  <div class="encabezado__acciones">
    <button
      type="button"
      class="encabezado__tema"
      [attr.aria-label]="tema.oscuro() ? 'Usar tema claro' : 'Usar tema oscuro'"
      (click)="tema.alternar()">
      <span class="encabezado__punto"></span>
    </button>

    <a
      class="encabezado__usuario"
      routerLink="/perfil"
      title="Perfil"
      aria-label="Abrir perfil">
      {{ auth.iniciales() }}
    </a>
  </div>
</div>
