<ion-header class="encabezado-app ion-no-border">
  <app-encabezado antetitulo="Nuevo servicio" titulo="Registrar ganancia" />
</ion-header>

<ion-content>
  <div class="contenido registrar">

    <app-campos-ganancia
      [servicios]="servicios()"
      [(servicioId)]="servicioId"
      [(nombreOtro)]="nombreOtro"
      [(digitos)]="digitos"
      [(propina)]="propina"
      [(propinaLibre)]="propinaLibre" />

    <div class="momento">
      <div class="tarjeta momento__dato momento__dato--fecha">
        <span class="etiqueta">Fecha</span>
        <span class="momento__valor">Hoy, {{ fechaTexto() }}</span>
      </div>
      <div class="tarjeta momento__dato momento__dato--hora">
        <span class="etiqueta">Hora</span>
        <span class="momento__valor">{{ hora() }}</span>
      </div>
    </div>

    <div class="grupo">
      <label class="etiqueta-seccion" for="notas">
        Notas <span class="opcional">(opcional)</span>
      </label>
      <input
        id="notas"
        class="campo"
        placeholder="Cliente nuevo, referido, etc."
        [value]="notas()"
        (input)="escribirNotas($event)">
    </div>

    <button
      type="button"
      class="boton-guardar"
      [class.boton-guardar--activo]="puedeGuardar()"
      [disabled]="!puedeGuardar()"
      (click)="guardar()">
      {{ guardando() ? 'Guardando…' : 'Guardar ganancia' }}
    </button>

  </div>
</ion-content>

@if (guardada(); as g) {
  <div class="confirmacion" role="status">
    <div class="confirmacion__circulo">
      <span class="confirmacion__check" aria-hidden="true">
        <span></span><span></span>
      </span>
    </div>
    <div class="confirmacion__textos">
      <span class="confirmacion__titulo">Ganancia registrada</span>
      <span class="serif confirmacion__monto">{{ g.monto }}</span>
      <span class="confirmacion__detalle">{{ g.servicio }} · {{ g.hora }}</span>
    </div>
  </div>
}
